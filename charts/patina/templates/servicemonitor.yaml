{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "patina.fullname" . }}
  labels:
    {{- include "patina.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "patina.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      # /metrics needs the admin token as a bearer token.
      authorization:
        type: Bearer
        credentials:
          name: {{ include "patina.secretName" . }}
          key: PATINA_ADMIN_TOKEN
{{- end }}
