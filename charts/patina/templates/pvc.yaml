{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) (not .Values.database.urlSecret.name) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "patina.fullname" . }}
  labels:
    {{- include "patina.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
