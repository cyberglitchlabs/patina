{{- if not .Values.existingSecret }}
{{- /* Reuse the tokens of an existing Secret so upgrades keep them; lookup
returns an empty map under helm template, so fresh tokens are generated there. */ -}}
{{- $feed := randAlphaNum 48 }}
{{- $admin := randAlphaNum 48 }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "patina.fullname" .) }}
{{- if and $existing $existing.data }}
{{- if (get $existing.data "PATINA_FEED_TOKEN") }}
{{- $feed = b64dec (get $existing.data "PATINA_FEED_TOKEN") }}
{{- end }}
{{- if (get $existing.data "PATINA_ADMIN_TOKEN") }}
{{- $admin = b64dec (get $existing.data "PATINA_ADMIN_TOKEN") }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "patina.fullname" . }}
  labels:
    {{- include "patina.labels" . | nindent 4 }}
type: Opaque
stringData:
  PATINA_FEED_TOKEN: {{ $feed | quote }}
  PATINA_ADMIN_TOKEN: {{ $admin | quote }}
{{- end }}
