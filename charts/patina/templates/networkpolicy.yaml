{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "patina.fullname" . }}
  labels:
    {{- include "patina.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "patina.selectorLabels" . | nindent 6 }}
  # Ingress only; no egress rules, since Patina must reach provider APIs and the tuner.
  policyTypes:
    - Ingress
  {{- /* An empty ingressFrom renders no ingress rule, so the policy denies all ingress. */}}
  {{- with .Values.networkPolicy.ingressFrom }}
  ingress:
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: http
          protocol: TCP
  {{- end }}
{{- end }}
