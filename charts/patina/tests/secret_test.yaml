suite: token secret
templates:
  - templates/secret.yaml
tests:
  - it: generates both tokens as 48 alphanumeric characters
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-patina
      - matchRegex:
          path: stringData.PATINA_FEED_TOKEN
          pattern: '^[A-Za-z0-9]{48}$'
      - matchRegex:
          path: stringData.PATINA_ADMIN_TOKEN
          pattern: '^[A-Za-z0-9]{48}$'
  - it: does not keep the Secret on uninstall
    asserts:
      - notExists:
          path: metadata.annotations["helm.sh/resource-policy"]
  - it: renders no Secret when existingSecret is set
    set:
      existingSecret: mine
    asserts:
      - hasDocuments:
          count: 0
