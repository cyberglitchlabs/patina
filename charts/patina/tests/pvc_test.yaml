suite: pvc
templates:
  - templates/pvc.yaml
tests:
  - it: creates a PVC by default
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: RELEASE-NAME-patina
      - equal:
          path: spec.accessModes
          value: ["ReadWriteOnce"]
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi
      - notExists:
          path: spec.storageClassName
      - notExists:
          path: metadata.namespace
  - it: honours size and storage class
    set:
      persistence:
        size: 5Gi
        storageClass: fast
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 5Gi
      - equal:
          path: spec.storageClassName
          value: fast
  - it: renders nothing when persistence is disabled
    set:
      persistence:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: renders nothing with an existing claim
    set:
      persistence:
        existingClaim: mine
    asserts:
      - hasDocuments:
          count: 0
  - it: renders nothing with Postgres
    set:
      database:
        urlSecret:
          name: db
    asserts:
      - hasDocuments:
          count: 0
