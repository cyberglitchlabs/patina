suite: values schema
templates:
  - templates/configmap.yaml
tests:
  - it: rejects more than one replica
    set:
      replicaCount: 2
    asserts:
      - failedTemplate: {}
  - it: rejects an unknown top-level key
    set:
      bogus: 1
    asserts:
      - failedTemplate: {}
  - it: rejects a non-integer service port
    set:
      service.port: "x"
    asserts:
      - failedTemplate: {}
  - it: rejects a non-string persistence size
    set:
      persistence.size: 5
    asserts:
      - failedTemplate: {}
