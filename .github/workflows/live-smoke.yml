name: Live smoke

# MANUAL ONLY. This workflow contacts the real Gracenote service, so it must
# never run on a schedule, push or pull request. Start it from the Actions
# tab ("Run workflow"). It makes 2 requests in total.
on:
  workflow_dispatch:
    inputs:
      postal_code:
        description: Postal code of the lineup to check
        default: "55401"
        required: false
        type: string
      lineup_id:
        description: Gracenote lineup id to check
        default: USA-OTA55401
        required: false
        type: string

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Inputs go through env (not interpolated into the script) so a
      # malicious value cannot inject shell commands.
      - name: Live Gracenote check
        env:
          PATINA_SMOKE_POSTAL_CODE: ${{ inputs.postal_code }}
          PATINA_SMOKE_LINEUP_ID: ${{ inputs.lineup_id }}
        run: cargo test --locked --test live_smoke -- --ignored --nocapture
