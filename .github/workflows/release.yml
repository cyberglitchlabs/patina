name: Release

# Two stages, both only on pushes to main (never on pull requests, so a fork
# PR can neither release nor publish an image):
#   1. release-please reads the conventional commits on main and opens or
#      updates a "release PR" that bumps Cargo.toml / Cargo.lock and
#      CHANGELOG.md. Merging that PR creates the GitHub release and tag.
#   2. When (and only when) a release was just created, the publish job builds
#      the multi-arch image from that tag and pushes it to GHCR.
on:
  push:
    branches: [main]

# Never run two release workflows at once, and never cancel one half way
# (a cancelled publish could leave a release without its image).
concurrency:
  group: release
  cancel-in-progress: false

# Nothing by default; each job below asks for exactly what it needs.
permissions: {}

jobs:
  release-please:
    # Do not run on forks: they have no right to release this project.
    if: github.repository == 'cyberglitchlabs/patina'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and GitHub release, push the release branch
      pull-requests: write # open and update the release PR
      issues: write # release-please labels its PRs; the action docs list this
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # KNOWN GAP: PRs created with the default GITHUB_TOKEN do not trigger
      # `pull_request` workflows, so release PRs would get no CI (and could
      # never merge under branch protection that requires CI). Fix: create a
      # fine-grained PAT or GitHub App token (contents + pull-requests write
      # on this repo) and store it as the repository secret
      # RELEASE_PLEASE_TOKEN. Without that secret this falls back to
      # GITHUB_TOKEN. See "Releasing" in the README.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # Runs only when release-please really created a release in this push.
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Cap the (emulated, therefore slow) arm64 build.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
      id-token: write # keyless signing of the attestation (OIDC)
      attestations: write # store the attestation
      artifact-metadata: write # storage record that actions/attest creates
    env:
      IMAGE: ghcr.io/cyberglitchlabs/patina
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build exactly the released commit, not whatever main is now.
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      # QEMU lets this amd64 runner build the linux/arm64 image.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Computes the tags X.Y.Z, X.Y, X and latest. `value` is given because
      # the workflow runs on a branch push, not on the tag itself.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }},enable=true
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # The OCI labels come from the Dockerfile, filled in by these build
          # args (metadata-action's own labels are not used: they would
          # override the licenses label with whatever GitHub detects).
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # BuildKit attaches an SBOM and a max-detail provenance record to
          # the image index.
          sbom: true
          provenance: mode=max

      # Signed GitHub build-provenance attestation for the image digest,
      # pushed to the registry next to the image. (actions/attest is the
      # current action; actions/attest-build-provenance v4 just wraps it.)
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
